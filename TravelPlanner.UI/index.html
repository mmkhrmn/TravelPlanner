<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seyahat Planlayıcı</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">
  
  <style>
    body { 
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      min-height: 100vh;
      color: #334155;
      font-size: 0.9rem;
    }

    .app-header {
      padding: 1.5rem 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      background: rgba(255, 255, 255, 0.4);
    }
    
    .app-title {
      color: #1e293b;
      font-weight: 600;
      font-size: 1.4rem;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .glass-card { 
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      padding: 1.75rem;
    }

    .form-control, .form-select {
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 0.4rem;
    }

    .btn-create {
      background: #2563eb;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-create:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
    }

    .itinerary-timeline {
      position: relative;
      padding-left: 1.5rem;
      margin-top: 1rem;
    }
    
    .itinerary-timeline::before {
      content: '';
      position: absolute;
      left: 0.35rem;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #cbd5e1;
      border-radius: 2px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 1.25rem;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 0.5s ease forwards;
    }

    .timeline-marker {
      position: absolute;
      left: -1.43rem;
      top: 0.2rem;
      width: 0.75rem;
      height: 0.75rem;
      background: #ffffff;
      border: 2px solid #3b82f6;
      border-radius: 50%;
      z-index: 1;
      box-shadow: 0 0 0 4px #ffffff; 
    }

    .timeline-time {
      display: inline-block;
      font-weight: 500;
      color: #1e40af;
      background: #dbeafe;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 0.4rem;
      letter-spacing: 0.3px;
    }

    .timeline-content {
      background: #ffffff;
      padding: 1rem 1.15rem;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
    }

    .timeline-content:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.04);
      border-color: #cbd5e1;
    }

    .timeline-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.25rem;
    }

    .timeline-desc {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 0;
      line-height: 1.5;
    }

    .ai-bold-text {
      font-weight: 600; 
      color: #0f172a;
    }

    .route-intro-text {
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 1.5rem;
      line-height: 1.5;
      background: #fff;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border-left: 3px solid #3b82f6;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .empty-state-icon {
      font-size: 3.5rem;
      color: #94a3b8;
      opacity: 0.5;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="container-xl d-flex align-items-center">
      <i class="bi bi-airplane-engines-fill text-primary fs-3 me-2"></i>
      <h1 class="app-title">Seyahat Planlayıcı</h1>
    </div>
  </header>

  <main class="container-xl mb-5 pb-4">
    <div class="row g-4">
      
      <div class="col-lg-4 col-md-5">
        <div class="glass-card sticky-top" style="top: 2rem; z-index: 10;">
          <h5 class="mb-4 fw-semibold" style="font-size: 1.05rem; color: #1e293b;">
            <i class="bi bi-sliders me-2 text-primary"></i>Planlayıcı
          </h5>

          <div class="mb-3">
            <label for="countrySelect" class="form-label">Ülke Seçiniz <span class="text-danger">*</span></label>
            <select id="countrySelect" class="form-select">
              <option value="">Ülke seçin</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="citySelect" class="form-label">Şehir Seçiniz <span class="text-danger">*</span></label>
            <select id="citySelect" class="form-select" disabled>
              <option value="">Önce ülke seçin</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="wakeUpTime" class="form-label">Güne Başlama Saati <span class="text-danger">*</span></label>
            <input id="wakeUpTime" type="time" class="form-control" />
          </div>
          
          <div class="mb-4">
            <label for="travelNotes" class="form-label">Özel İstekler / Notlar</label>
            <textarea id="travelNotes" class="form-control" rows="3" placeholder="Örn: Müzeleri gezmek istiyorum, vegan mekanlar önerin..."></textarea>
          </div>

          <div id="formError" class="text-danger mb-3 d-none" style="font-size: 0.8rem; font-weight: 500;">
            <i class="bi bi-exclamation-circle-fill me-1"></i>Lütfen zorunlu alanları (*) doldurun.
          </div>

          <button id="btnCreateRoute" class="btn btn-primary btn-create text-white">
            <i class="bi bi-send-fill me-2"></i>Rotamı Oluştur
          </button>
        </div>
      </div>

      <div class="col-lg-8 col-md-7">
        <div class="glass-card h-100" style="min-height: 60vh;">
          
          <div id="emptyState" class="h-100 d-flex flex-column align-items-center justify-content-center text-center py-5">
            <i class="bi bi-map empty-state-icon"></i>
            <h5 class="fw-semibold mb-2" style="color: #334155;">Rotanız Burada Görünecek</h5>
            <p class="text-muted mb-0" style="max-width: 300px;">
              Yandaki formu doldurun ve sizin için en mükemmel seyahat planını hazırlayalım.
            </p>
          </div>

          <div id="routeResult" class="d-none">
            <div class="d-flex align-items-center justify-content-between border-bottom pb-3 mb-4">
              <h4 class="mb-0 fw-semibold text-dark" style="font-size: 1.2rem;">
                <i class="bi bi-geo-alt-fill text-primary me-2"></i>Seyahat Planınız
              </h4>
            </div>
            <div id="routeResultContent"></div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script>
    const apiBase = window.location.port === '5146'
      ? window.location.origin
      : 'http://localhost:5146';

    const countrySelect = document.getElementById('countrySelect');
    const citySelect = document.getElementById('citySelect');
    const emptyState = document.getElementById('emptyState');
    const wakeUpTime = document.getElementById('wakeUpTime');
    const travelNotes = document.getElementById('travelNotes');
    const btnCreateRoute = document.getElementById('btnCreateRoute');
    const routeResult = document.getElementById('routeResult');
    const routeResultContent = document.getElementById('routeResultContent');
    const formError = document.getElementById('formError');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatAiText(value) {
      return escapeHtml(value)
        .replace(/\*\*(.*?)\*\*/g, '<span class="ai-bold-text">$1</span>')
        .replace(/\*(.*?)\*/g, '<span class="ai-bold-text">$1</span>');
    }

    async function loadCountries() {
      try {
        countrySelect.innerHTML = '<option value="">Ülkeler yükleniyor...</option>';

        const res = await fetch(apiBase + '/api/countries');

        if (!res.ok) {
          throw new Error('Ülkeler alınamadı. HTTP ' + res.status);
        }

        const data = await res.json();
        const countries = Array.isArray(data) ? data : (data.value ?? []);

        countrySelect.innerHTML = '<option value="">Ülke seçin</option>';

        countries.forEach(country => {
          const option = document.createElement('option');
          option.value = String(country.id ?? '');
          option.textContent = country.name ?? '(isim yok)';
          countrySelect.appendChild(option);
        });

        console.log('Ülkeler yüklendi:', countries);
      } catch (err) {
        console.error('Ülkeler yüklenirken hata:', err);
        countrySelect.innerHTML = '<option value="">Ülkeler yüklenemedi</option>';
      }
    }

    async function loadCities(countryId) {
      try {
        citySelect.disabled = true;
        citySelect.innerHTML = '<option value="">Şehirler yükleniyor...</option>';

        const res = await fetch(apiBase + '/api/cities?countryId=' + encodeURIComponent(countryId));

        if (!res.ok) {
          throw new Error('Şehirler alınamadı. HTTP ' + res.status);
        }

        const data = await res.json();
        const cities = Array.isArray(data) ? data : (data.value ?? []);

        citySelect.innerHTML = '<option value="">Şehir seçin</option>';

        cities.forEach(city => {
          const option = document.createElement('option');
          option.value = String(city.id ?? '');
          option.textContent = city.name ?? '(isim yok)';
          citySelect.appendChild(option);
        });

        citySelect.disabled = false;

        console.log('Şehirler yüklendi:', cities);
      } catch (err) {
        console.error('Şehirler yüklenirken hata:', err);
        citySelect.innerHTML = '<option value="">Şehirler yüklenemedi</option>';
      }
    }

    countrySelect.addEventListener('change', () => {
      const selectedId = countrySelect.value;

      citySelect.innerHTML = '<option value="">Önce ülke seçin</option>';
      citySelect.disabled = true;

      if (!selectedId) {
        return;
      }

      loadCities(selectedId);
    });

    function parseRouteToTimeline(text) {
      if (!text) {
        return '<div class="alert alert-warning">Rota sonucu boş geldi.</div>';
      }

      const lines = String(text).split('\n');
      let outputHtml = '<div class="itinerary-timeline">';
      let introHtml = '';
      let animationDelay = 0;

      lines.forEach(rawLine => {
        const line = String(rawLine ?? '').trim();

        if (!line || line.toLowerCase() === 'başarılı') {
          return;
        }

        const match = line.match(/^(\d{2}:\d{2})\s*[-–]\s*(.*)$/);

        if (match) {
          const time = match[1];
          const restOfLine = match[2];

          let title = restOfLine;
          let desc = '';

          const colonIndex = restOfLine.indexOf(':');

          if (colonIndex > -1) {
            title = restOfLine.substring(0, colonIndex).trim();
            desc = restOfLine.substring(colonIndex + 1).trim();
          }

          animationDelay += 0.1;

          outputHtml += `
            <div class="timeline-item" style="animation-delay: ${animationDelay}s">
              <div class="timeline-marker"></div>
              <div class="timeline-time"><i class="bi bi-clock me-1"></i>${escapeHtml(time)}</div>
              <div class="timeline-content">
                <div class="timeline-title">${formatAiText(title)}</div>
                <p class="timeline-desc">${formatAiText(desc)}</p>
              </div>
            </div>
          `;
        } else {
          introHtml += `
            <div class="route-intro-text">
              <i class="bi bi-stars text-primary me-2"></i>${formatAiText(line)}
            </div>
          `;
        }
      });

      outputHtml += '</div>';

      return introHtml + outputHtml;
    }

    btnCreateRoute.addEventListener('click', async () => {
      if (countrySelect.value === '' || citySelect.value === '' || wakeUpTime.value === '') {
        formError.classList.remove('d-none');
        return;
      }

      formError.classList.add('d-none');

      const countryName = countrySelect.options[countrySelect.selectedIndex]?.text || '';
      const cityName = citySelect.options[citySelect.selectedIndex]?.text || '';
      const wake = wakeUpTime.value || '';
      const notes = travelNotes.value || '';

      const payload = {
        CountryName: countryName,
        CityName: cityName,
        WakeUpTime: wake,
        UserNotes: notes
      };

      const originalBtnHtml = btnCreateRoute.innerHTML;

      btnCreateRoute.disabled = true;
      btnCreateRoute.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Planlanıyor...';

      emptyState.classList.add('d-none');
      routeResult.classList.add('d-none');
      routeResultContent.innerHTML = '';

      try {
        const res = await fetch(apiBase + '/api/route/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();

          routeResultContent.innerHTML =
            '<div class="alert alert-danger" style="font-size:0.85rem;">Sunucu hatası: '
            + res.status
            + '<br>'
            + escapeHtml(txt)
            + '</div>';

          routeResult.classList.remove('d-none');
          return;
        }

        const result = await res.json();
        const draft = result.DraftRoute ?? result.draftRoute ?? result.route ?? result.message ?? '';

        routeResultContent.innerHTML = parseRouteToTimeline(draft);
        routeResult.classList.remove('d-none');

        if (window.innerWidth < 992) {
          setTimeout(() => {
            routeResult.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 100);
        }
      } catch (err) {
        routeResultContent.innerHTML =
          '<div class="alert alert-danger" style="font-size:0.85rem;">Hata: '
          + escapeHtml(err.message || err)
          + '</div>';

        routeResult.classList.remove('d-none');
      } finally {
        btnCreateRoute.disabled = false;
        btnCreateRoute.innerHTML = originalBtnHtml;
      }
    });

    document.addEventListener('DOMContentLoaded', loadCountries);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
